<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vivo Exclusive - Staff Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0d0d2b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .portal-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 60px 50px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .logo {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #5f72bd, #9b23ea);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    .logo span { font-size: 40px; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      color: rgba(160,160,192,0.7);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .portal-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #5f72bd, #9b23ea);
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      transition: all 0.3s;
      box-shadow: 0 10px 30px rgba(95,114,189,0.3);
    }
    .portal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(95,114,189,0.4);
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: rgba(160,160,192,0.5);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }
    .back-link:hover { color: #5f72bd; }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.2;
      z-index: -1;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: linear-gradient(135deg, #5f72bd, #9b23ea);
      top: -100px; right: -100px;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: linear-gradient(135deg, #ff6a00, #ee0979);
      bottom: -80px; left: -80px;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="portal-card">
    <div class="logo">🏬</div>
    <h1>Vivo Exclusive</h1>
    <p>Staff Ticket Management Portal<br>Login to view and manage store hygiene tickets</p>

    <a href="https://script.google.com/macros/s/AKfycbwrng4VC_nwyTnqF0Z1NqES_o1YPrFHToeG4wgfhkQrv80gzm5xlFzKe6qc4DkifTOpMw/exec" class="portal-btn">
      🎫 Enter Staff Portal
    </a>

    <a href="https://www.vivoexclusivetn.com/" class="back-link">← Back to Website</a>
  </div>
</body>
</html>
